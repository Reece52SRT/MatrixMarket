name: MatrixMarket CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  # ------------------------------------------------------------------
  # JOB 1: Android Application Build & Unit Tests
  # ------------------------------------------------------------------
  android-build-and-test:
    name: Build & Test Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
          cache-dependency-path: android/gradle/wrapper/gradle-wrapper.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: android

      - name: Run Android Lint Checks
        run: ./gradlew lintDebug
        working-directory: android

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest
        working-directory: android

      - name: Upload Android Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results
          path: android/app/build/reports/tests/testDebugUnitTest/

  # ------------------------------------------------------------------
  # JOB 2: .NET 8 Web API Build & Test
  # ------------------------------------------------------------------
  backend-build-and-test:
    name: Build & Test .NET 8 Web API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore
        working-directory: backend/MatrixMarket.Api

      - name: Build Web API
        run: dotnet build --configuration Release --no-restore
        working-directory: backend/MatrixMarket.Api

      - name: Run .NET Unit Tests (if test project exists)
        run: dotnet test --configuration Release --no-build --verbosity normal || echo "No backend test project configured yet"
        working-directory: backend/MatrixMarket.Api
